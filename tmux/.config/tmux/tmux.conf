# Merged config: Omarchy's tmux defaults + personal keybindings and plugins.
# bind -N "..." annotations feed the Omarchy tmux keybindings menu (SUPER+ALT+K,
# also: omarchy-menu-tmux-keybindings --print).

# Prefix: C-Space primary (Omarchy), C-a backup (old personal muscle memory)
set -g prefix C-Space
set -g prefix2 C-a
bind C-Space send-prefix
bind C-a send-prefix -2

# Reload config
bind -N "Reload tmux configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Vi mode for copy
setw -g mode-keys vi
bind -N "Start selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind -N "Split pane below" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane right" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane

bind -N "Split pane below" h split-window -v -c "#{pane_current_path}"
bind -N "Split pane right" v split-window -h -c "#{pane_current_path}"
bind -N "Split pane below" - split-window -v -c "#{pane_current_path}"
bind -N "Split pane right" | split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane above" -n C-M-Up select-pane -U
bind -N "Focus pane below" -n C-M-Down select-pane -D

bind -N "Grow pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Grow pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Grow pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Grow pane right" -n C-M-S-Right resize-pane -R 5

# Window navigation
# (Alt+1..9 deliberately NOT bound: kitty owns those for its tabs)
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "New window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Previous window" -n M-H previous-window
bind -N "Next window" -n M-L next-window
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "New session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme (ANSI color names only, so it follows the active Omarchy theme)
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"

# Plugins (TPM lives in this repo as a pinned git submodule; the other
# plugins are cloned by TPM into ~/.config/tmux/plugins/ on prefix+I,
# or headless via ~/.config/tmux/plugins/tpm/bin/install_plugins)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'sainnhe/tmux-fzf'

run '~/.config/tmux/plugins/tpm/tpm'
